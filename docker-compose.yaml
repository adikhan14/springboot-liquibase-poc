# Local SQL Server for the PoC. Stands in for Azure SQL.
#
#   docker compose up -d      start
#   docker compose down -v    stop and wipe the data
#
# NOTE: the image is linux/amd64 only; on Apple Silicon it runs under emulation.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: liquibase-poc-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "L0cal!DevPassw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The port opens before the engine is ready, so probe with a real query.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'L0cal!DevPassw0rd' -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Runs once, creates the database, exits. Liquibase never issues CREATE DATABASE,
  # so without this the app has nothing to connect to.
  create-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - L0cal!DevPassw0rd
      - -C
      - -b
      - -Q
      - "IF DB_ID('liquibase_poc') IS NULL CREATE DATABASE [liquibase_poc];"

volumes:
  mssql-data:
