spring:
  application:
    name: springboot-liquibase-poc

  datasource:
    # Azure SQL requires encryption; never disable trustServerCertificate against a real server.
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;database=liquibase_poc;encrypt=true;trustServerCertificate=true;loginTimeout=30}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:L0cal!DevPassw0rd}

  jpa:
    # Liquibase owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    # Off by default: migrations are a deliberate step, not a startup side effect.
    # Overridable per environment, e.g. LIQUIBASE_ENABLED=true for local development.
    enabled: ${LIQUIBASE_ENABLED:false}
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: dbo
